<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --bosque:#1b4228; --naranja:#bd4c18; --line:#cfd6cb; --tinta:#33403a; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#fff; font-family:'Inter',system-ui,sans-serif; color:var(--tinta); padding:24px; }
  .flow{ background:#fff; }
  #flujo-ciudadano{ width:1060px; }
  #flujo-admin{ width:1060px; margin-top:60px; }

  .row{ display:flex; align-items:flex-start; justify-content:center; gap:10px; }
  .rowsep{ display:flex; justify-content:center; align-items:center; height:34px; }
  .rowsep .down{ color:var(--naranja); font-size:26px; line-height:1; font-weight:700; }

  .arrow{ align-self:center; color:var(--naranja); font-size:24px; font-weight:700; flex:none; margin-top:-26px; }

  .step{ width:178px; flex:none; display:flex; flex-direction:column; align-items:center; }
  .step .thumb{ position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fafbf9; width:100%; }
  .step .thumb img{ display:block; width:100%; height:auto; }
  .step .badge{ position:absolute; top:6px; left:6px; background:var(--bosque); color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; letter-spacing:.3px; }
  .step .num{ font-size:11.5px; font-weight:700; color:var(--naranja); margin-top:7px; }
  .step .ttl{ font-size:12px; font-weight:500; color:var(--tinta); text-align:center; line-height:1.3; margin-top:1px; max-width:160px; }

  /* admin: thumbs un poco más grandes */
  #flujo-admin .step{ width:190px; }
</style>
</head>
<body>
  <div class="flow" id="flujo-ciudadano"></div>
  <div class="flow" id="flujo-admin"></div>

<script>
  const BASE = 'file:///C:/dev/MinkIA/wireframes-png/';
  const CIU = [
    ["C01","Pantalla de bienvenida","splash"],["C02","Onboarding y guías","onboarding"],
    ["C03","Inicio de sesión","login"],["C04","Registro de cuenta","registro"],
    ["C05","Recuperación de contraseña","recuperar-contrasena"],["C06","Solicitud de permisos","permisos"],
    ["C07","Inicio con mapa de calor","inicio-mapa-calor"],["C08","Exploración del mapa","explorar-mapa"],
    ["C09","Captura con la cámara","camara-captura"],["C10","Análisis con IA","analisis-ia"],
    ["C11","Formulario del reporte","formulario-reporte"],["C12","Confirmación y sincronización","confirmacion-sync"],
    ["C13","Historial de reportes","mis-reportes"],["C14","Estado vacío","estado-vacio"],
    ["C15","Detalle y seguimiento","detalle-seguimiento"],["C16","Notificaciones","notificaciones"],
    ["C17","Perfil y Minka digital","perfil-minka"],["C18","Configuración","configuracion"],
  ];
  const ADM = [
    ["A01","Panel del administrador","panel-dashboard"],["A02","Bandeja de alertas","bandeja-alertas"],
    ["A03","Puntos críticos y agrupación","puntos-criticos-clustering"],["A04","Detalle y validación con IA","detalle-validacion"],
    ["A05","Planificación de rutas","planificacion-rutas"],
  ];

  function buildFlow(containerId, role, list, prefix, perRow){
    const cont = document.getElementById(containerId);
    const total = list.length;
    for (let r = 0; r * perRow < total; r++){
      const rowItems = list.slice(r*perRow, r*perRow + perRow);
      const row = document.createElement('div'); row.className = 'row';
      rowItems.forEach(([id,title,slug], j) => {
        const idx = r*perRow + j;
        const step = document.createElement('div'); step.className = 'step';
        step.innerHTML =
          '<div class="thumb"><span class="badge">'+(idx+1)+'</span>'+
          '<img src="'+BASE+role+'/'+id+'-'+slug+'.png"></div>'+
          '<div class="num">'+prefix+'.'+(idx+1)+'</div>'+
          '<div class="ttl">'+title+'</div>';
        row.appendChild(step);
        if (j < rowItems.length - 1){
          const a = document.createElement('div'); a.className='arrow'; a.textContent='→';
          row.appendChild(a);
        }
      });
      cont.appendChild(row);
      if ((r+1)*perRow < total){
        const sep = document.createElement('div'); sep.className='rowsep';
        sep.innerHTML = '<span class="down">↓</span>';
        cont.appendChild(sep);
      }
    }
  }

  buildFlow('flujo-ciudadano', 'ciudadano', CIU, '4.2.2', 5);
  buildFlow('flujo-admin', 'admin', ADM, '4.2.3', 5);
</script>
</body>
</html>
